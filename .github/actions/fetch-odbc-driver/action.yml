name: Fetch ODBC driver
description: >
  Download the latest SingleStore ODBC driver win64 MSI from the memsql/singlestore-odbc-connector releases and report its version.

inputs:
  github-token:
    description: Token used for the GitHub API release lookup.
    required: true
  output-file:
    description: Path the downloaded MSI is written to (keep the default name; the bundle wxs references it).
    required: false
    default: singlestore-connector-odbc.msi

outputs:
  driver-version:
    description: Version parsed from the MSI asset name (falls back to the release tag).
    value: ${{ steps.fetch.outputs.driver-version }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        $headers = @{
          Accept = "application/vnd.github+json"
          Authorization = "Bearer $env:GITHUB_TOKEN"
          "X-GitHub-Api-Version" = "2022-11-28"
          "User-Agent" = "singlestore-power-bi-connector-ci"
        }

        $releaseInfo = Invoke-RestMethod `
          -Headers $headers `
          -Uri "https://api.github.com/repos/memsql/singlestore-odbc-connector/releases/latest"

        $asset = $releaseInfo.assets.where({ $_.browser_download_url -like "*win64.msi" })[0]
        if (-not $asset) {
          throw "No *win64.msi asset found in latest singlestore-odbc-connector release ($($releaseInfo.tag_name))."
        }

        $releaseUrl = $asset.browser_download_url
        # The asset is named singlestore-connector-odbc-<version>-win64.msi; capture <version>.
        # -match sets $Matches only on a real match, so the tag_name fallback fires when the
        # filename doesn't follow the expected pattern (a plain -replace would return the whole
        # name unchanged, which is non-empty and would silently mask the mismatch).
        if ($asset.name -match 'odbc-(.*)-win64\.msi') { $driverVersion = $Matches[1] }
        else { $driverVersion = ($releaseInfo.tag_name -replace '^v', '') }
        Write-Host "Release download URL: $releaseUrl"
        Write-Host "ODBC driver version: $driverVersion"

        # Publish the version as both a step output (for the job `outputs:` mapping) and a job
        # env var (so ${{ env.driver-version }} keeps resolving in later build steps unchanged).
        "driver-version=$driverVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "driver-version=$driverVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

        Invoke-WebRequest -URI $releaseUrl -OutFile "${{ inputs.output-file }}"
