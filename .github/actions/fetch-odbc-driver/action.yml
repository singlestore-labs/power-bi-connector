name: Fetch ODBC driver
description: >
  Download a specific SingleStore ODBC driver win64 MSI from the memsql/singlestore-odbc-connector releases.
  The version is pinned by the caller so a release tag fully defines the driver bytes that are tested,
  signed and shipped; `latest` is never resolved at build time.

inputs:
  github-token:
    description: Token used for the GitHub API release lookup.
    required: true
  version:
    description: ODBC driver version to download, without the leading "v" (e.g. 1.2.2).
    required: true
  output-file:
    description: Path the downloaded MSI is written to (keep the default name; the bundle wxs references it).
    required: false
    default: singlestore-connector-odbc.msi

outputs:
  driver-version:
    description: Version of the downloaded MSI, as confirmed from the asset name.
    value: ${{ steps.fetch.outputs.driver-version }}

runs:
  using: composite
  steps:
    - id: fetch
      shell: powershell
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        DRIVER_VERSION: ${{ inputs.version }}
      run: |
        $headers = @{
          Accept = "application/vnd.github+json"
          Authorization = "Bearer $env:GITHUB_TOKEN"
          "X-GitHub-Api-Version" = "2022-11-28"
          "User-Agent" = "singlestore-power-bi-connector-ci"
        }

        $version = $env:DRIVER_VERSION
        if (-not $version) { throw "The 'version' input is required." }

        $releaseInfo = Invoke-RestMethod `
          -Headers $headers `
          -Uri "https://api.github.com/repos/memsql/singlestore-odbc-connector/releases/tags/v$version"

        # The asset is named singlestore-connector-odbc-<version>-win64.msi. Match on the exact
        # name rather than a wildcard so a mislabelled or extra asset can never be picked up.
        $expectedName = "singlestore-connector-odbc-$version-win64.msi"
        $asset = $releaseInfo.assets.where({ $_.name -eq $expectedName })[0]
        if (-not $asset) {
          $names = ($releaseInfo.assets | ForEach-Object { $_.name }) -join ', '
          throw "Asset '$expectedName' not found in singlestore-odbc-connector release $($releaseInfo.tag_name). Assets: $names"
        }

        Write-Host "Release: $($releaseInfo.tag_name) ($($releaseInfo.html_url))"
        Write-Host "Asset:   $($asset.name) ($($asset.size) bytes, updated $($asset.updated_at))"
        Write-Host "ODBC driver version: $version"
        "driver-version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

        Invoke-WebRequest -URI $asset.browser_download_url -OutFile "${{ inputs.output-file }}"
