name: PowerBI Connector CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      sign:
        description: Run the signing job (dry run, nothing is published)
        type: boolean
        default: false

permissions:
  contents: read

env:
  connector-version: 1.1.0
  # Exact SingleStore ODBC driver release that is tested, embedded, signed and shipped. Bumped
  # deliberately (see RELEASE.md); `latest` is never resolved at build time so a tag fully defines
  # the release bytes.
  odbc-driver-version: 1.2.2
  # Pin the SDK test harness so test behavior does not change unexpectedly between runs.
  pq-sdk-tools-version: 2.155.2
  # .NET Sign CLI (https://github.com/dotnet/sign). It has no stable release; the 1.x versions on
  # NuGet under the same id are an unrelated, unlisted package. Pinned so a signing run is
  # reproducible; bump deliberately.
  sign-cli-version: 0.9.1-beta.26431.1

jobs:
  # Fetched exactly once. Every other job downloads this artifact, so the driver bytes that are
  # tested, embedded and shipped are the same file, and an unsigned upstream build fails fast.
  odbc-driver:
    name: Fetch & verify ODBC driver
    runs-on: windows-latest

    outputs:
      driver-version: ${{ steps.driver.outputs.driver-version }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Fetch ODBC driver installer
        id: driver
        uses: ./.github/actions/fetch-odbc-driver
        with:
          github-token: ${{ github.token }}
          version: ${{ env.odbc-driver-version }}

      - name: Verify ODBC driver MSI is signed by SingleStore
        shell: powershell
        run: .\.github\scripts\verify-signature.ps1 -Files singlestore-connector-odbc.msi

      - name: Upload ODBC driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: odbc-driver
          path: singlestore-connector-odbc.msi
          if-no-files-found: error

  build:
    name: Build connector & installers
    needs: [odbc-driver]
    runs-on: windows-latest

    env:
      driver-version: ${{ needs.odbc-driver.outputs.driver-version }}

    # Exposed so downstream jobs can name versions without re-deriving them. driver-version is
    # re-exported here so `sign` and `release` only need `build`, not `odbc-driver` directly.
    outputs:
      driver-version: ${{ needs.odbc-driver.outputs.driver-version }}
      bundle-version: ${{ steps.bundle-version.outputs.bundle-version }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Install WiX Toolset
        shell: powershell
        run: choco install -y -r --no-progress wixtoolset

      - name: Download ODBC driver installer
        uses: actions/download-artifact@v4
        with:
          name: odbc-driver
          # lands singlestore-connector-odbc.msi in the repo root, where Bundle.wxs expects it

      - name: Read bundle version
        id: bundle-version
        shell: bash
        run: |
          # The bundle version is tracked independently of the connector/driver versions.
          bundle_version=$(sed -nE 's/.*<\?define Version = "([0-9]+\.[0-9]+\.[0-9]+)" \?>.*/\1/p' \
            "power-bi-bundle-installer/Bundle.wxs" | head -n1)
          echo "Bundle version: $bundle_version"
          echo "bundle-version=$bundle_version" >> "$GITHUB_OUTPUT"

      - name: Check version sync
        shell: bash
        run: ./scripts/check-version-sync.sh

      - name: Build connector
        shell: powershell
        run: msbuild ".\SingleStore Direct Query.sln" -p:Configuration=Release

      - name: Upload SingleStoreODBC.mez artifact
        uses: actions/upload-artifact@v4
        with:
          name: SingleStoreODBC.mez
          path: bin\Release\SingleStoreODBC.mez

      - name: Build connector installer
        shell: powershell
        run: |
          New-Alias -Name candle -Value "C:\Program Files (x86)\WiX Toolset v3.14\bin\candle"
          New-Alias -Name light -Value "C:\Program Files (x86)\WiX Toolset v3.14\bin\light"
          Copy-Item -Path ".\bin\Release\SingleStoreODBC.mez" -Destination ".\SingleStoreODBC.mez"
          candle ".\power-bi-connector-installer\Power BI Connector.wxs" -o .\power-bi-connector-installer\obj\
          light ".\power-bi-connector-installer\obj\*.wixobj" -o .\power_bi_connector_installer.msi

      - name: Upload connector installer artifact (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: connector-msi
          path: power_bi_connector_installer.msi
          if-no-files-found: error

      - name: Build bundle installer (unsigned, for PR/master validation)
        shell: powershell
        # Env var names contain hyphens, so they must be accessed with ${env:...} brace syntax.
        run: .\.github\scripts\build-bundle.ps1 -ConnectorVersion ${env:connector-version} -DriverVersion ${env:driver-version}

      - name: Upload unsigned bundle artifact
        uses: actions/upload-artifact@v4
        with:
          # Deliberately not named like the signed one: the release job downloads by exact
          # artifact name, so an unsigned bundle can never reach a GitHub Release.
          name: "unsigned-bundle-${{ env.connector-version }}-pbi__${{ env.driver-version }}-odbc"
          path: bin\singlestore-power-bi-bundle-*.exe
          if-no-files-found: error

  # Tier 1: deterministic PQ/PQOut tests over Helpers.pqm. No database, ODBC driver,
  # credentials, or network access is required by the test execution itself.
  test:
    name: Unit tests (Tier 1)
    runs-on: windows-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Build test extension
        shell: powershell
        run: msbuild ".\test\SingleStoreODBC.Tests.mproj" -p:Configuration=Release

      - name: Fetch pinned PQTest
        id: pqtest
        uses: ./.github/actions/setup-pqtest
        with:
          version: ${{ env.pq-sdk-tools-version }}

      - name: Run unit-test battery
        shell: powershell
        run: |
          .\.github\workflows\run_pqtest_battery.ps1 `
            -PqTestExe "${{ steps.pqtest.outputs.path }}" `
            -SettingsFile ".\test\Settings\Unit.testsettings.json" `
            -BatteryName "PQTest unit-test"

      - name: Upload PQTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-query-unit-test-results
          path: test\TestResults\**
          if-no-files-found: warn

  # Tier 2: query-folding tests against a real, throwaway S2MS cluster.
  # NOT run on plain master pushes: the PR that produced the merge already ran it, and the tag run re-checks it.
  test-folding:
    name: Query folding (Tier 2)
    needs: [odbc-driver]
    runs-on: windows-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))

    env:
      # Single source of truth for the DB name — passed to BOTH s2ms_cluster.py (which creates
      # and seeds it) and setup_folding_credentials.ps1 (which substitutes it into the parameter
      # query). They must agree or the `folding_types` navigation fails.
      DB_NAME: folding_ci
      S2MS_API_KEY: ${{ secrets.S2MS_API_KEY }}
      SQL_USER_PASSWORD: ${{ secrets.SQL_USER_PASSWORD }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SingleStore management client
        shell: powershell
        run: python -m pip install singlestoredb

      - name: Download ODBC driver installer
        uses: actions/download-artifact@v4
        with:
          name: odbc-driver

      - name: Install ODBC driver
        shell: powershell
        run: |
          # System-wide MSI install registers "SingleStore ODBC Unicode Driver" with the ODBC
          # Driver Manager, which is what the mashup runtime under PQTest uses to fold.
          $log = "odbc-install.log"
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
            '/i', 'singlestore-connector-odbc.msi', '/quiet', '/norestart', '/l*v', $log
          if ($p.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log | Write-Host }
            throw "ODBC driver MSI install failed with exit code $($p.ExitCode)."
          }
          Write-Host "ODBC driver installed."

      - name: Build connector
        shell: powershell
        run: msbuild ".\SingleStore Direct Query.sln" -p:Configuration=Release

      - name: Fetch pinned PQTest
        id: pqtest
        uses: ./.github/actions/setup-pqtest
        with:
          version: ${{ env.pq-sdk-tools-version }}

      - name: Start S2MS cluster
        shell: powershell
        run: python .github\workflows\s2ms_cluster.py start $env:DB_NAME

      - name: Configure PQTest credentials
        shell: powershell
        run: |
          .\.github\workflows\setup_folding_credentials.ps1 `
            -PqTestExe "${{ steps.pqtest.outputs.path }}" `
            -ExtensionPath "bin\Release\SingleStoreODBC.mez" `
            -ParameterQuery "test\Folding\Connection.parameter.pq" `
            -Database $env:DB_NAME

      - name: Configure PQTest credentials (Custom SQL)
        shell: powershell
        run: |
          # SingleStoreODBC.Query uses a separate parameter query, and PQTest keys credentials per
          # (extension, parameter-query path) — so the Custom SQL battery needs its own credential.
          .\.github\workflows\setup_folding_credentials.ps1 `
            -PqTestExe "${{ steps.pqtest.outputs.path }}" `
            -ExtensionPath "bin\Release\SingleStoreODBC.mez" `
            -ParameterQuery "test\Folding\Connection.CustomSQL.parameter.pq" `
            -Database $env:DB_NAME

      - name: Run folding battery
        shell: powershell
        run: |
          # Folding is enforced by FailOnFoldingFailure in the settings file.
          .\.github\workflows\run_pqtest_battery.ps1 `
            -PqTestExe "${{ steps.pqtest.outputs.path }}" `
            -SettingsFile ".\test\Settings\Folding.testsettings.json" `
            -BatteryName "PQTest folding"

      - name: Run non-folding battery
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          # Cases that intentionally do NOT fold (e.g. LIMIT). Separate settings with
          # FailOnFoldingFailure=false so the expected fold-failure isn't a test failure.
          .\.github\workflows\run_pqtest_battery.ps1 `
            -PqTestExe "${{ steps.pqtest.outputs.path }}" `
            -SettingsFile ".\test\Settings\Folding.NoFold.testsettings.json" `
            -BatteryName "PQTest non-folding"

      - name: Run custom-SQL battery
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          # SingleStoreODBC.Query custom SQL: a WHERE/ORDER BY layered on top of the native query
          # must still fold (FailOnFoldingFailure=true), and the trailing ";" in the parameter
          # query must be stripped or Value.NativeQuery would have errored during setup.
          .\.github\workflows\run_pqtest_battery.ps1 `
            -PqTestExe "${{ steps.pqtest.outputs.path }}" `
            -SettingsFile ".\test\Settings\Folding.CustomSQL.testsettings.json" `
            -BatteryName "PQTest custom-SQL"

      - name: Terminate S2MS cluster
        if: always()
        shell: powershell
        run: python .github\workflows\s2ms_cluster.py terminate

      - name: Upload folding results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: power-query-folding-test-results
          path: test\TestResults\**
          if-no-files-found: warn

  # Signs the connector MSI, then builds the bundle from the signed MSIs and signs the Burn engine
  # and the bundle itself. Runs only after every test tier is green, so a SingleStore signature
  # always means the exact artifact passed release validation.
  #
  # `environment: release` is what makes the OIDC subject stable (it would otherwise differ per
  # tag) and is where the Azure secrets live; it can also require a human approval. Signing is
  # gated to tags and explicit manual dry runs so PR builds never get id-token: write.
  sign:
    name: Sign installers (Azure Artifact Signing)
    needs: [build, test, test-folding]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.sign)
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    env:
      driver-version: ${{ needs.build.outputs.driver-version }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install WiX Toolset
        shell: powershell
        run: choco install -y -r --no-progress wixtoolset

      - name: Download connector installer (unsigned)
        uses: actions/download-artifact@v4
        with:
          name: connector-msi

      - name: Download ODBC driver installer
        uses: actions/download-artifact@v4
        with:
          name: odbc-driver

      - name: Print OIDC subject (for the Entra federated credential)
        shell: bash
        run: |
          # Prints only the `sub` claim of this job's OIDC token, never the token itself. The Entra
          # federated credential must match this value exactly. This repo uses GitHub's immutable
          # subject format (owner@id/repo@id), so read it from here instead of deriving it by hand.
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          payload=$(printf '%s' "$token" | cut -d. -f2 | tr '_-' '/+')
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          payload="$payload$(printf '%*s' "$pad" '' | tr ' ' '=')"
          printf '%s' "$payload" | base64 -d | jq -r '
            "OIDC sub:            " + .sub,
            "repository_id:       " + .repository_id,
            "repository_owner_id: " + .repository_owner_id,
            "environment:         " + .environment'

      - name: Azure login (OIDC, no client secret)
        uses: azure/login@2035af27c2cea8ff426397d10e3edb28906b51df # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install .NET Sign CLI
        shell: powershell
        run: dotnet tool install -g sign --version ${env:sign-cli-version}

      - name: Sign connector MSI
        shell: powershell
        run: .\.github\scripts\sign-windows.ps1 -Files power_bi_connector_installer.msi

      - name: Build bundle from signed MSIs
        id: bundle
        shell: powershell
        run: .\.github\scripts\build-bundle.ps1 -ConnectorVersion ${env:connector-version} -DriverVersion ${env:driver-version}

      - name: Sign Burn engine and bundle
        shell: powershell
        run: .\.github\scripts\sign-bundle.ps1 -Bundle "${{ steps.bundle.outputs.bundle-path }}"

      - name: Verify signatures on everything we ship
        shell: powershell
        run: |
          .\.github\scripts\verify-signature.ps1 -Files `
            power_bi_connector_installer.msi, `
            singlestore-connector-odbc.msi, `
            "${{ steps.bundle.outputs.bundle-path }}"

      - name: Upload signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: signed-bundle
          path: bin\singlestore-power-bi-bundle-*.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Downloaded by exact artifact name: the unsigned bundle from `build` must never be published.
      - name: Download signed bundle
        uses: actions/download-artifact@v4
        with:
          name: signed-bundle
          path: release-assets

      - name: Download connector .mez (Microsoft handoff artifact)
        uses: actions/download-artifact@v4
        with:
          name: SingleStoreODBC.mez
          path: release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            release-assets/singlestore-power-bi-bundle-*.exe
            release-assets/SingleStoreODBC.mez
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## SingleStore Direct Query Connector for Power BI — ${{ github.ref_name }}

            | Component | Version |
            | --- | --- |
            | Power BI connector | ${{ env.connector-version }} |
            | SingleStore ODBC driver (bundled) | ${{ needs.build.outputs.driver-version }} |
            | Bundle installer | ${{ needs.build.outputs.bundle-version }} |

            **Download the `.exe` bundle installer below** — it installs both the SingleStore ODBC
            driver and the Power BI connector. The installer and the MSIs inside it are digitally
            signed by SingleStore, Inc. See the [README](../../blob/master/README.md) for setup,
            and [RELEASE.md](../../blob/master/RELEASE.md) for how releases are produced.

            > ⚠️ The Power BI connector itself (`SingleStoreODBC.mez`) is **not** Microsoft-certified
            > and is an unsigned custom connector. You must enable custom connectors in Power BI
            > Desktop (see README → "Enable custom connectors").
